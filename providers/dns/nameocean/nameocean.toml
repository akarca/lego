Name = "NameOcean"
Description = ''''''
URL = "https://nameocean.net/"
Code = "nameocean"
Since = "v5.7.0"

Example = '''
NAMEOCEAN_API_KEY="no_live_xxxxxxxxxxxxxxxxxxxxx" \
lego run --dns nameocean -d '*.example.com' -d example.com
'''

Additional = '''
## API key

Create an API key with the `dns:read` and `dns:write` scopes in the [NameOcean dashboard](https://nameocean.net/dashboard/api/).
'''

[Configuration]
  [Configuration.Credentials]
    NAMEOCEAN_API_KEY = "API key"
  [Configuration.Additional]
    NAMEOCEAN_POLLING_INTERVAL = "Time between DNS propagation check in seconds (Default: 2)"
    NAMEOCEAN_PROPAGATION_TIMEOUT = "Maximum waiting time for DNS propagation in seconds (Default: 120)"
    NAMEOCEAN_TTL = "The TTL of the TXT record used for the DNS challenge in seconds (Default: 300). Rounded up to 5m, 15m, 30m, 1h or 1d."
    NAMEOCEAN_HTTP_TIMEOUT = "API request timeout in seconds (Default: 30)"

[Links]
  API = "https://nameocean.net/developers/api/"
